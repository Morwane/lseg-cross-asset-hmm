[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lseg-cross-asset-hmm-regime-risk-overlay"
version = "1.0.0"
description = "Cross-Asset HMM Regime Detection & Risk Overlay Engine using LSEG Data"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
